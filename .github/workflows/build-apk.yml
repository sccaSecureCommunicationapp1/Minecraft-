name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Cordova APK
      uses: ionic-team/cordova-build-action@v1
      with:
        platform: android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Coin-Master-APK
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
