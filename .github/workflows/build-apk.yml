name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Auto-Generate Android Project & Build
      run: |
        npm install -g cordova
        cordova create myApp com.coinmaster.app "Coin Master"
        cd myApp
        rm -rf www/*
        cp ../index.html www/
        cordova platform add android@12.0.0
        cordova build android --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Coin-Master-APK
        path: myApp/platforms/android/app/build/outputs/apk/release/
